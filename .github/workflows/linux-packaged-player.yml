name: Linux packaged player

on:
  pull_request:
    paths:
      - "apps/player/**"
      - "packages/**"
      - "examples/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "scripts/**"
      - ".kinetra/**"
      - ".github/workflows/linux-packaged-player.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install Electron and xvfb libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgtk-3-0 \
            libnss3 \
            libnspr4 \
            libxss1 \
            libasound2 \
            libgbm1 \
            libxshmfence1 \
            libdrm2 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libpango-1.0-0 \
            libcairo2 \
            || sudo apt-get install -y \
            xvfb \
            libgtk-3-0t64 \
            libnss3 \
            libnspr4 \
            libxss1 \
            libasound2t64 \
            libgbm1 \
            libxshmfence1 \
            libdrm2 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libatk1.0-0t64 \
            libatk-bridge2.0-0t64 \
            libcups2t64 \
            libpango-1.0-0 \
            libcairo2
      - run: pnpm check
      - run: pnpm --filter @kinetra/player package:linux
      - run: pnpm --filter @kinetra/player smoke:linux:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: kinetra-linux-x64
          path: apps/player/release/KinetraGame-linux-x64
          if-no-files-found: error
