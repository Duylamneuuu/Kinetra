name: Linux Electron acceptance

on:
  pull_request:
    paths:
      - "apps/player/**"
      - "packages/**"
      - "examples/reference-game/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/linux-electron-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-electron-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install headless Electron libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libgbm1 \
            libx11-xcb1 \
            libxss1 \
            libasound2t64 \
            || sudo apt-get install -y \
              xvfb \
              libnss3 \
              libatk1.0-0 \
              libatk-bridge2.0-0 \
              libgtk-3-0 \
              libgbm1 \
              libx11-xcb1 \
              libxss1 \
              libasound2
      - name: Build workspace
        run: pnpm build
      - name: Run dev Electron acceptance under xvfb
        env:
          KINETRA_LINUX_REAL_ELECTRON: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" pnpm --filter @kinetra/verification test
          xvfb-run -a -s "-screen 0 1280x720x24" pnpm --filter @kinetra/mcp-server test
