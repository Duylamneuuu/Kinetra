name: Blender asset pipeline\n\non:\n  pull_request:\n    paths:\n      - "packages/blender-bridge/**"\n      - "packages/asset-pipeline/**"\n      - ".github/workflows/blender-pipeline.yml"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  blender-export:\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - run: corepack enable\n      - run: pnpm install --no-frozen-lockfile\n      - name: Install Blender\n        run: |\n          sudo apt-get update\n          sudo apt-get install -y blender\n          blender --version\n      - name: Create deterministic .blend fixture\n        run: |\n          blender --background \\n            --python packages/blender-bridge/python/create_fixture.py \\n            -- --output "$RUNNER_TEMP/kinetra-fixture.blend"\n      - name: Export fixture through Kinetra Blender bridge script\n        run: |\n          blender --background "$RUNNER_TEMP/kinetra-fixture.blend" \\n            --python packages/blender-bridge/python/export_glb.py \\n            -- --output "$RUNNER_TEMP/kinetra-fixture.glb" \\n               --manifest "$RUNNER_TEMP/kinetra-fixture.manifest.json"\n      - run: pnpm --filter @kinetra/asset-pipeline build\n      - name: Validate exported GLB through Kinetra asset pipeline\n        run: |\n          node packages/asset-pipeline/scripts/validate-glb.mjs "$RUNNER_TEMP/kinetra-fixture.glb"\n          cat "$RUNNER_TEMP/kinetra-fixture.manifest.json"\n      - uses: actions/upload-artifact@v4\n        with:\n          name: kinetra-blender-fixture\n          path: |\n            ${{ runner.temp }}/kinetra-fixture.glb\n            ${{ runner.temp }}/kinetra-fixture.manifest.json\n          if-no-files-found: error\n